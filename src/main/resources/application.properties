spring.application.name=energy-coffee

spring.datasource.url=jdbc:postgresql://localhost:5432/energycoffee
spring.datasource.username=energycoffee_app
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

management.endpoints.web.exposure.include=health,info

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen3:1.7b

logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.hibernate.engine.jdbc.env.internal.JdbcEnvironmentInitiator=DEBUG